kind = "web"
previewPath = "/"
title = "sethbrasile.com"
version = "1.0.0"
id = "artifacts/sethbrasile"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20115

[services.development]
run = "pnpm --filter @workspace/sethbrasile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sethbrasile", "run", "build" ]
publicDir = "artifacts/sethbrasile/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20115"
BASE_PATH = "/"
